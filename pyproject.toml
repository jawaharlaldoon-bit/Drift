[project]
name = "drift-taskmaster"
version = "0.1.0"
description = "Proof-carrying remediation for failed AI workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sse-starlette>=2.1,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "google-genai>=1.30,<2",
  "google-adk>=1.10,<3",
  "google-cloud-firestore>=2.19,<3",
  "google-cloud-pubsub>=2.27,<3",
  "google-cloud-logging>=3.11,<4",
  "google-auth>=2.40,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
drift-api = "drift.api:run"
drift-demo-target = "demo_target.api:run"
drift-brand-guard = "scripts.brand_guard:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["drift", "demo_target", "scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
